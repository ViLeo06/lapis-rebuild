name: Private source checkpoint
on:
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/source-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          sha256sum "$RUNNER_TEMP/source.tar.gz" > "$RUNNER_TEMP/source.sha256"
      - name: Prepare locked tools without package lifecycle scripts
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit
          tar -czf "$RUNNER_TEMP/node-tools.tar.gz" node_modules
          sha256sum "$RUNNER_TEMP/node-tools.tar.gz" > "$RUNNER_TEMP/node-tools.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-source-checkpoint
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source.sha256
            ${{ runner.temp }}/node-tools.tar.gz
            ${{ runner.temp }}/node-tools.sha256
          retention-days: 1
          if-no-files-found: error
