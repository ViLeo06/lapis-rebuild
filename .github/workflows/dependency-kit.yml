name: Private offline dependency kit
on:
  push:
    branches: [codex/m0-ani]
    paths: [.github/workflows/dependency-kit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package source and public tool dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit/deps" "$RUNNER_TEMP/export"
          git archive HEAD | gzip > "$RUNNER_TEMP/export/source.tar.gz"
          cd "$RUNNER_TEMP/kit/deps"
          npm init -y >/dev/null
          npm install --save-exact --ignore-scripts phaser@3.90.0 vite@7 typescript@5 @playwright/test@1
          npm audit --json > audit.json || true
          node --version > runtime.txt
          npm --version >> runtime.txt
          cd "$RUNNER_TEMP/kit"
          if command -v 7z >/dev/null; then
            mkdir sevenzip
            cp -L /usr/lib/p7zip/7z /usr/lib/p7zip/7z.so sevenzip/ 2>/dev/null || cp -L "$(command -v 7z)" sevenzip/7z
          fi
          tar -czf "$RUNNER_TEMP/export/dependency-kit.tar.gz" .
          cd "$RUNNER_TEMP/export"
          sha256sum source.tar.gz dependency-kit.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-dependency-kit
          path: ${{ runner.temp }}/export/
          retention-days: 1
          if-no-files-found: error
