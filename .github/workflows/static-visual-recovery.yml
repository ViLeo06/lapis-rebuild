name: Static visual fidelity research
on:
  push:
    branches: ['codex/visual-fidelity']
    paths:
      - '.github/workflows/static-visual-recovery.yml'
      - 'tools/probe_visual_fidelity.py'
      - 'tools/probe_visual_semantics.py'
      - 'tools/build_s5_visual_preview.py'
      - 'tests/parsers/test_visual_fidelity_probe.py'
      - 'tests/parsers/test_visual_semantics.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Synthetic probe regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests/parsers/test_visual_fidelity_probe.py \
            tests/parsers/test_visual_semantics.py
      - name: Fetch and verify official UPX decompressor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 60 https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz -o "$RUNNER_TEMP/upx.tar.xz"
          echo "402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  $RUNNER_TEMP/upx.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
      - name: Static extract fixed-hash 2.2 client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 180 --retry 1 https://oss.figupaw.com/client-updates/YBCS-Online-Setup-2.2.exe -o "$RUNNER_TEMP/client.exe"
          echo "c42f37b06f27a6ee0b14e6fea6129cf89956a3e1c7a37c1172a28577f6cdae88  $RUNNER_TEMP/client.exe" | sha256sum -c -
          python3 tools/extract/extract_client.py "$RUNNER_TEMP/client.exe" --payload "$RUNNER_TEMP/payload.7z" --extract-dir "$RUNNER_TEMP/extracted" --expected-installer-sha256 c42f37b06f27a6ee0b14e6fea6129cf89956a3e1c7a37c1172a28577f6cdae88
          echo "c1be05eb2977a8aae8cbe8b716bc1e3957263edde8187d5269d554b327f13cbd  $RUNNER_TEMP/extracted/client/NeoDark.exe" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/s5-visual"
          "$RUNNER_TEMP/upx-5.2.1-amd64_linux/upx" -d -o "$RUNNER_TEMP/s5-visual/neodark-unpacked.bin" "$RUNNER_TEMP/extracted/client/NeoDark.exe" > "$RUNNER_TEMP/s5-visual/unpack.log" 2>&1
          chmod 0644 "$RUNNER_TEMP/s5-visual/neodark-unpacked.bin"
          echo "432636dd2129b6dd688527eaecdf183a46567112a8d9f6ffc4569d25697c2de7  $RUNNER_TEMP/s5-visual/neodark-unpacked.bin" | sha256sum -c -
      - name: Probe visual, map and audio evidence without executing client
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe_visual_fidelity.py \
            --client-root "$RUNNER_TEMP/extracted/client" \
            --image "$RUNNER_TEMP/s5-visual/neodark-unpacked.bin" \
            --out "$RUNNER_TEMP/s5-visual/visual-fidelity.json"
          python3 tools/probe_visual_semantics.py \
            --image "$RUNNER_TEMP/s5-visual/neodark-unpacked.bin" \
            --out "$RUNNER_TEMP/s5-visual/visual-semantics.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'s5-visual'
          r=json.loads((root/'visual-fidelity.json').read_text(encoding='utf-8'))
          s=json.loads((root/'visual-semantics.json').read_text(encoding='utf-8'))
          print('ANI',r['animations']['ani_count'],'MagicRes',r['animations']['magicres_count'])
          print('SMF',r['maps']['smf_count'],'records',r['maps']['record_count'],'nonzero-flags',r['maps']['nonzero_flag_records'])
          print('audio',r['audio']['resource_count'],r['audio']['extension_distribution'])
          print('cadence',s['ani_timing']['common_frame_threshold_formula'],s['ani_timing']['common_consumer_sites'])
          print('hit sequence',s['battle_presentation']['sequence'])
          print('unresolved',s['unresolved'])
          PY
      - name: Build private pixel validation pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_s5_visual_preview.py \
            --client-root "$RUNNER_TEMP/extracted/client" \
            --out "$RUNNER_TEMP/s5-visual/preview"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s5-static-visual-fidelity
          path: ${{ runner.temp }}/s5-visual/
          retention-days: 5
          if-no-files-found: error
