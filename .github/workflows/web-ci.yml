# S24 final acceptance trigger: 2026-09-19
name: Web and parser validation
on:
  push:
    branches: ['codex/**']
    paths: ['web/**', 'tools/**', 'tests/**', 'data/**', 'manifests/**', '.github/workflows/web-ci.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Parser tests and synthetic pack
        run: |
          python3 -m unittest discover -s tests/parsers -v
          python3 tools/testing/make_web_fixture.py --out web/public/game-data
      - name: Locked dependencies, typecheck, unit tests and build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Build standalone synthetic preview
        shell: bash
        run: |
          mkdir -p web/test-results web/ci-pack-builder
          python3 tools/package_web_preview.py --dist web/dist --pack web/public/game-data --out "$RUNNER_TEMP/offline.html" | tee web/test-results/m7-standalone-synthetic.json
          cp "$RUNNER_TEMP/offline.html" web/test-results/lapis-m7-synthetic.html
          cp "$RUNNER_TEMP/offline.html" web/ci-pack-builder/lapis-m7-synthetic.html
          tar -czf web/ci-pack-builder/m7-private-pack-builder.tar.gz tools manifests web/THIRD_PARTY_NOTICES.txt
      - name: Publish current-code private pack builder before Playwright cleanup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m7-private-pack-builder
          path: web/ci-pack-builder/
          retention-days: 3
          if-no-files-found: error
      - name: Chromium integration and offline tests
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/offline.html
        run: npm run test:e2e
      - name: S41 M7.1 final acceptance
        if: github.ref_name == 'codex/s41-m7-1-final-glue' || github.head_ref == 'codex/s41-m7-1-final-glue'
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/offline.html
          S41_M7_1_FINAL: '1'
        run: npm run test:e2e -- e2e/s41-m7-1-acceptance.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-synthetic-validation
          path: web/test-results/
          retention-days: 7
          if-no-files-found: warn
  private-original:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[private-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Fetch hash-pinned sample or recover retained verified preview
        id: private_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLIENT_URL="https://oss.figupaw.com/client-updates/YBCS-Online-Setup-2.2.exe"
          INSTALLER_SHA="c42f37b06f27a6ee0b14e6fea6129cf89956a3e1c7a37c1172a28577f6cdae88"
          VERIFIED_HEAD="0a51f242a6357031f7f5b83c743fae7724c7e2f9"
          VERIFIED_RUN="35545442305"
          VERIFIED_ARTIFACT="10616895482"
          VERIFIED_HTML_SHA="f509c71b69ae5b41419a1f9c397108200bad1a1ef449f386927378d7d0ae59b4"

          if curl --fail --location --max-time 180 --retry 1 "$CLIENT_URL" -o "$RUNNER_TEMP/client.exe"; then
            echo "$INSTALLER_SHA  $RUNNER_TEMP/client.exe" | sha256sum -c -
            python3 tools/extract/extract_client.py "$RUNNER_TEMP/client.exe" --payload "$RUNNER_TEMP/payload.7z" --extract-dir "$RUNNER_TEMP/extracted" --expected-installer-sha256 "$INSTALLER_SHA"
            python3 tools/prepare_web.py --client-root "$RUNNER_TEMP/extracted/client" --out web/public/game-data
            echo "mode=installer" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pinned client URL is unavailable; using retained preview only after strict lineage and SHA verification."
            compare="$RUNNER_TEMP/private-lineage-compare.json"
            curl --fail --location --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_HEAD...${GITHUB_SHA}"               -o "$compare"
            python3 - "$compare" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          allowed={'.github/workflows/web-ci.yml','.github/workflows/s17-monster-visual-recovery.yml','web/soak.mjs','web/m6-validation-trigger.txt'}
          changed={row['filename'] for row in payload.get('files',[])}
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit(f'Fallback lineage rejected; runtime/content files changed: {unexpected}')
          print(json.dumps({'fallback_lineage_ok':True,'changed_files':sorted(changed)},ensure_ascii=False))
          PY
            curl --fail --location --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ARTIFACT/zip"               -o "$RUNNER_TEMP/verified-private.zip"
            mkdir -p "$RUNNER_TEMP/verified-private"
            unzip -q "$RUNNER_TEMP/verified-private.zip" -d "$RUNNER_TEMP/verified-private"
            preview="$(find "$RUNNER_TEMP/verified-private" -type f -name lapis-private.html -print -quit)"
            test -n "$preview"
            cp "$preview" "$RUNNER_TEMP/lapis-private.html"
            echo "$VERIFIED_HTML_SHA  $RUNNER_TEMP/lapis-private.html" | sha256sum -c -
            mkdir -p web/test-results
            python3 - "$compare" web/test-results/private-fallback-lineage.json "$VERIFIED_HEAD" "$VERIFIED_RUN" "$VERIFIED_ARTIFACT" "$VERIFIED_HTML_SHA" "${GITHUB_SHA}" <<'PY'
          import json,sys
          compare_path,out,verified_head,verified_run,artifact_id,html_sha,current_head=sys.argv[1:]
          compare=json.load(open(compare_path,encoding='utf-8'))
          record={
            'status':'verified-retained-preview',
            'reason':'Pinned public installer URL returned HTTP failure.',
            'verified_head':verified_head,
            'verified_run_id':int(verified_run),
            'verified_artifact_id':int(artifact_id),
            'verified_html_sha256':html_sha,
            'current_head':current_head,
            'allowed_delta':['.github/workflows/web-ci.yml','.github/workflows/s17-monster-visual-recovery.yml','web/soak.mjs','web/m6-validation-trigger.txt'],
            'actual_delta':sorted(row['filename'] for row in compare.get('files',[])),
            'evidence_boundary':'The retained preview is reused only because no runtime/content source changed since the fixed-hash private-original run. The current soak script is executed against that exact verified HTML.',
          }
          json.dump(record,open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
            echo "mode=retained-preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture MagicRes, map, combat, binary and content structural evidence
        if: steps.private_source.outputs.mode == 'installer'
        run: |
          python3 tools/inspect_magicres.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/magicres-summary.json
          python3 tools/probe_maps.py --client-root "$RUNNER_TEMP/extracted/client" --start 0 --count 12 --out web/test-results/map-probe.json
          python3 tools/probe_npc_quest.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/npc-quest-probe.json
          python3 tools/probe_combat_resources.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/combat-resource-summary.json --preview-dir web/test-results/combat-previews
          python3 tools/probe_battle_binary.py "$RUNNER_TEMP/extracted/client/NeoDark.exe" --out web/test-results/battle-binary-xrefs.json
          python3 tools/inspect_quest_resources.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/quest-resource-structure.json
          python3 tools/validate/validate_quest_content.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --out web/test-results/quest-content-summary.json
          python3 tools/validate/validate_extended_content.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --out web/test-results/extended-content-summary.json
          python3 tools/validate/validate_tip_assets.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/tip-structure-summary.json
      - name: Publish static evidence early
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-static-evidence
          path: |
            web/test-results/magicres-summary.json
            web/test-results/map-probe.json
            web/test-results/npc-quest-probe.json
            web/test-results/combat-resource-summary.json
            web/test-results/combat-previews/
            web/test-results/battle-binary-xrefs.json
            web/test-results/quest-resource-structure.json
            web/test-results/quest-content-summary.json
            web/test-results/extended-content-summary.json
            web/test-results/tip-structure-summary.json
          retention-days: 3
          if-no-files-found: error
      - name: Publish private combat sources
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-combat-source
          path: |
            ${{ runner.temp }}/extracted/client/NRes/CombatMap.Tip
            ${{ runner.temp }}/extracted/client/Dlg/CombatSelect.Tdg
          retention-days: 1
          if-no-files-found: error
      - name: Extract Quest source for private analysis
        if: steps.private_source.outputs.mode == 'installer'
        run: python3 tools/extract/lib_archive.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --extract-dir "$RUNNER_TEMP/quest-source"
      - name: Publish private Quest source
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-quest-source
          path: ${{ runner.temp }}/quest-source/
          retention-days: 1
          if-no-files-found: error
      - name: Publish private NPC350 source
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-npc350-source
          path: ${{ runner.temp }}/extracted/client/NRes/NPC350.Tip
          retention-days: 1
          if-no-files-found: error
      - name: Build and browser setup
        working-directory: web
        run: |
          npm ci --ignore-scripts
          if [ "${{ steps.private_source.outputs.mode }}" = "installer" ]; then npm run build; fi
          npx playwright install --with-deps chromium
      - name: Private standalone preview
        if: steps.private_source.outputs.mode == 'installer'
        run: python3 tools/package_web_preview.py --dist web/dist --pack web/public/game-data --out "$RUNNER_TEMP/lapis-private.html"
      - name: Real-resource browser and offline tests
        if: steps.private_source.outputs.mode == 'installer'
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/lapis-private.html
        # One CI retry absorbs transient Chromium screenshot/protocol failures;
        # deterministic assertion failures still fail both attempts.
        run: npm run test:e2e -- --retries=1
      - name: Record inherited private-browser acceptance
        if: steps.private_source.outputs.mode == 'retained-preview'
        run: |
          echo "Fixed-hash private browser acceptance is inherited from run 35545442305 / head 0a51f242a6357031f7f5b83c743fae7724c7e2f9."
          echo "Current lineage guard permits only web/soak.mjs and this workflow to differ."
      - name: Real thirty-minute diagnostic soak
        if: contains(github.event.head_commit.message, '[private-soak]')
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/lapis-private.html
        run: node soak.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-original-validation
          path: |
            web/test-results/
            ${{ runner.temp }}/lapis-private.html
          retention-days: 3
          if-no-files-found: warn
